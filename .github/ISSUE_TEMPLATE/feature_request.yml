---
name: 功能建议
description: 提议新的评测任务、适配器或平台能力
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 这个建议改善的是评测公平性、可复现性，还是使用体验？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案
      description: 描述预期行为、数据模型或接口变化。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 新增 Agent 适配器
        - 新增测试任务 / Prompt
        - 评分算法
        - Dashboard / API
        - 执行隔离
        - 文档与协议
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: 取舍与风险
      description: 是否会破坏历史结果的可比性？是否需要新的数据库迁移？
